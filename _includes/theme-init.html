{% comment %}
  Sets data-theme on <html> before the first paint, so the page never flashes
  the wrong theme. Uses the visitor's saved choice (theme-toggle.js), otherwise
  their system setting. Inline on purpose: an external script would run too late.
{% endcomment %}
<script>
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('theme'); } catch (e) { /* storage blocked */ }
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
