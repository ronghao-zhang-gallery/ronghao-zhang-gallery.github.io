# Bird species for the Avians page (user, 2026-10-25), keyed by a short id that sightings in
# _data/avians.yml use (`species:`).
#   name   { en, zh, zh_hant }
#   scientific  scientific name (IOC World Bird List, as in the sticker library); shown in
#          italics under the name on the bird card
#   iucn   optional: the IUCN category by hand, only where the sticker library has none
#          (scripts/fetch_stickers.py otherwise takes it from the library)
#   ebird  eBird species code: names the range map in _data/ranges.yml (scripts/make_ranges.py
#          fetches it from eBird Status & Trends)
#   range_approx  optional, true: its eBird range looks unlike the expert maps (Birds of the World):
#          the map then shows "This range is based on eBird observations and may not be
#          accurate." while the range is drawn (user, 2026-11-04). Set it for every new species
#          whose range doesn't match (check with scripts/range_sheet.py).
#   range_note  optional { en, zh, zh_hant }: a further, species-specific line after that one
# Chinese names: Claude's choice from common usage; check them. From the Savannah NWR birds on
# (2026-10-31), Simplified is the IOC Chinese name and Traditional its character conversion.

