# eBird sensitive species (user, 2026-11-03): `sensitive: true` puts a "Sensitive" mark in its
# card's corner and on its checklist trip; its sightings are recorded only at state level
# (place `alaska`).
northern-hawk-owl:
  range_approx: true       # unlike Birds of the World: nonbreeding range only, no Siberia (see range_note) (2026-11-04)
  name: { en: Northern Hawk Owl, zh: 北方鹰鸮, zh_hant: 北方鷹鴞 }   # user's name (not IOC's 猛鸮)
  scientific: Surnia ulula
  ebird: nohowl
  sensitive: true
  # range_note: shown over the map while this bird's range is (user, 2026-11-03). eBird models
  # only its nonbreeding range, drawn as year-round (SEASON_AS in make_ranges.py), and has
  # nothing for its Asian range.
  range_note: { en: "eBird's data covers only part of its range: Siberia isn't shown.", zh: eBird 数据只覆盖其部分分布：未显示西伯利亚。, zh_hant: eBird 資料只涵蓋其部分分布：未顯示西伯利亞。 }

