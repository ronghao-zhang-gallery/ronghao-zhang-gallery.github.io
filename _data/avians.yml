    region: alaska
    lat: 59.9                     # Resurrection Bay off Seward, rounded (no spot given)
    lon: -149.5
  # Sensitive birds (user, 2026-11-03): eBird marks some species as sensitive and shows their
  # records only coarsely; the exact spot is kept private. Such a sighting is recorded as the
  # whole state. An `area` place has no dot and no coordinates: its birds' cards count every
  # place with `region: <its id>` as theirs, so clicking any Alaska dot shows them. It is not
  # counted in the page's "N places".
  - id: alaska
    continent: north-america
    area: true
    name: { en: AK, zh: 美国阿拉斯加州, zh_hant: 美國阿拉斯加州 }   # user, 2026-11-04: "AK", not "Alaska"

# dots: one dot on the map for several nearby places (user, 2026-11-01: "merge the 2 dots for
#   savannah, and merge the 2 dots for atlanta"). The places stay separate (cards, gallery and
#   search keep each park's name); only the map draws them as one dot.
#   id         the dot's name (used by the page in place of the places' ids)
#   places     the place ids it stands for
#   continent, lat, lon   as for a place: about the middle of its places, rounded
dots:
  - id: atlanta-area              # Murphey Candler Park (33.9), Legacy Park, Decatur (33.8),
    places: [murphey-candler, legacy-park, constitution-lakes]   # Constitution Lakes (33.7)
    continent: north-america
    lat: 33.8
    lon: -84.3
  - id: savannah-area             # Savannah NWR SC (32.2, -81.1) and Fort Pulaski NM GA (32.0, -80.9)
    places: [savannah-nwr, fort-pulaski]
    continent: north-america
    lat: 32.1
    lon: -81.0
  - id: kenai-area                # Kenai Fjords NP off Seward (59.9, -149.5) and Cooper Landing
    places: [kenai-fjords, cooper-landing]   # (60.5, -149.8); user, 2026-11-04
    continent: north-america
    lat: 60.2
    lon: -149.65

