# Bird sightings on the Avians page (avians.html, user 2026-10-25): the same map, continent bar
# and list as the Traces page, but every dot is a place where a bird was observed. The page
# reuses the Traces template (_includes/places/places-map.html, page="avians").
#
# places: one dot each (unless a dot below groups it with others).
#   id         short name, used by visits below
#   name       { en, zh, zh_hant }, in the same style as the captions
#   continent  an id from _data/continents.yml
#   lat, lon   ROUNDED to about 0.1° (~10 km): never the exact spot (so nests aren't given away)
#   region     optional: the `area` place it lies in (e.g. alaska), see below
#   area       true for a whole state standing in for a sensitive bird's spot: no dot, no lat/lon
# visits: one row per sighting in the dated list, newest first on the page. Added by
#   scripts/add_sighting.py from the photo's EXIF (only the place and species by hand):
#   place      a place id
#   species    an id from _data/species.yml (its name, and its range map if there is one)
#   photo      the photo's file name: in the image repo bird-<year> (large/ and thumb/), or,
#              for photos not imported there yet, a local export (preview from local-photos/).
#              Leave it out for a bird seen but not photographed (user, 2026-10-30): it still
#              gets its card ("No photo yet") and its dot, but nothing in the gallery. Such a
#              row needs only place, species, date and taken (the date, or "YYYY-MM-DDTHH:MM"
#              if the time is known: the page sorts by it)
#   export     the original export's file name, for photos in the image repo
#   cover      optional, true: the species' cover photo, on its card and in front of its gallery
#              stack (same bird, day and place); without one, the newest photo is used
#   date       the day it was taken ("YYYY-MM-DD"), shown on the page
#   taken      date and time to the hundredth of a second ("YYYY-MM-DDTHH:MM:SS.ss"): the page
#              sorts by it (bursts put several photos in one second)
#   camera, lens, focal (mm), aperture (f-number), exposure (seconds, "1/500"), iso
#   count      optional: how many were counted (from an eBird checklist), kept in the trip log
#
# The trip log, _data/trips.yml (every outing and the birds seen on it), is made from this
# file: after changing it by hand, run scripts/make_trips.py (add_sighting.py runs it).
#
# (The Cape May Warbler sighting from the homepage caption was removed, user 2026-10-25.)

